{{- $component := "postgres" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $component }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ $component }}
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
