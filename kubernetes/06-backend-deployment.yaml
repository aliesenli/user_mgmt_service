apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: user-mgmt
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: user-mgmt-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/aliesenli/user-mgmt-backend:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: user-mgmt-config
            - secretRef:
                name: user-mgmt-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      # Hinweis: liveness-/readinessProbe werden in Aufgabe 6 (Horizontal
      # Scaling) ergaenzt, sobald der Spring Boot Actuator Health-Endpoint
      # verfuegbar ist (siehe README in 06-Horizontal-Scaling).
