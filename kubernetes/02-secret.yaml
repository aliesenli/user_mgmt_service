# ACHTUNG: Dies ist eine Vorlage fuer die lokale/Demo-Nutzung. In einem echten
# Cluster wird dieses Secret NIE mit Klartextwerten eingecheckt, sondern via
# `kubectl create secret ... --dry-run=client -o yaml`, einem Secret-Manager
# (z.B. Sealed Secrets, External Secrets Operator, Vault) oder CI-Secrets
# erzeugt/injiziert. Die Werte hier sind Platzhalter.
apiVersion: v1
kind: Secret
metadata:
  name: user-mgmt-secret
  namespace: user-mgmt
  labels:
    app.kubernetes.io/part-of: user-mgmt-service
type: Opaque
stringData:
  POSTGRES_USER: "appuser"
  POSTGRES_PASSWORD: "changeme"
  SPRING_DATASOURCE_USERNAME: "appuser"
  SPRING_DATASOURCE_PASSWORD: "changeme"
  JWT_SECRET: "change-me-to-a-long-random-string"
