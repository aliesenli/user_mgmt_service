apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  # Der Service befuellt seine EndpointSlices ausschliesslich mit Pods, deren
  # readinessProbe erfolgreich ist. ingress-nginx balanciert direkt auf diese
  # ready Endpoints (Default: round_robin im Upstream) - kube-proxy wird vom
  # Ingress-Controller dabei umgangen. -> erfuellt Aufgabe-6-Kriterium 4.
  selector:
    {{- include "app.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8080
      name: http
