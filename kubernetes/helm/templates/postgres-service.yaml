apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "app.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      name: postgres
