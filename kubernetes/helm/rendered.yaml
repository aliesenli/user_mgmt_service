---
# Source: user-mgmt-service/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-user-mgmt-service-postgres
  namespace: user-mgmt
  labels:
    app.kubernetes.io/name: test-user-mgmt-service-postgres
    app.kubernetes.io/instance: test
spec:
  replicas: 1
  strategy:
    type: Recreate  # nur eine RWO-PVC -> kein RollingUpdate fuer die DB moeglich
  selector:
    matchLabels:
      app.kubernetes.io/name: test-user-mgmt-service-postgres
      app.kubernetes.io/instance: test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-user-mgmt-service-postgres
        app.kubernetes.io/instance: test
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: test-user-mgmt-service-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-user-mgmt-service-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: test-user-mgmt-service-config
                  key: POSTGRES_DB
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "userdb"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "userdb"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: test-user-mgmt-service-postgres

---
# Source: user-mgmt-service/templates/ingress.yaml
# KORREKTUR H4: Die rewrite-target-Annotation gilt bei ingress-nginx fuer ALLE
# Pfade eines Ingress-Objekts. Mit nur einem Objekt wurden dadurch auch alle
# Frontend-Pfade (/_next/..., /login, ...) auf "/" umgeschrieben. Deshalb jetzt
# zwei getrennte Ingress-Objekte: eines mit Rewrite nur fuer /api, eines ohne
# Annotation fuer das Frontend. ingress-nginx merged Regeln fuer denselben Host;
# der laengere /api-Pfad hat Vorrang vor dem Prefix "/".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-user-mgmt-service-api
  namespace: user-mgmt
  labels:
    helm.sh/chart: user-mgmt-service-0.2.0
    app.kubernetes.io/part-of: user-mgmt-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: test
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: app.aliesenli.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: test-user-mgmt-service-backend
                port:
                  number: 8080

---
# Source: user-mgmt-service/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-user-mgmt-service
  namespace: user-mgmt
  labels:
    helm.sh/chart: user-mgmt-service-0.2.0
    app.kubernetes.io/part-of: user-mgmt-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: test
spec:
  ingressClassName: nginx
  rules:
    - host: app.aliesenli.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-user-mgmt-service-frontend
                port:
                  number: 3000
