---
# Source: user-mgmt-service/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-user-mgmt-service-backend
  namespace: user-mgmt
  labels:
    app.kubernetes.io/name: test-user-mgmt-service-backend
    app.kubernetes.io/instance: test
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-user-mgmt-service-backend
      app.kubernetes.io/instance: test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-user-mgmt-service-backend
        app.kubernetes.io/instance: test
    spec:
      containers:
        - name: backend
          image: "ghcr.io/aliesenli/user-mgmt-backend:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: test-user-mgmt-service-config
            - secretRef:
                name: test-user-mgmt-service-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

