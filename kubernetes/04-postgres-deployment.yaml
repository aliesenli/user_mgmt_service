apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: user-mgmt
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: user-mgmt-service
spec:
  replicas: 1
  strategy:
    type: Recreate # nur eine RWO-PVC -> kein RollingUpdate fuer die DB moeglich
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-mgmt-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-mgmt-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: user-mgmt-config
                  key: POSTGRES_DB
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # vermeidet Probleme mit dem lost+found Verzeichnis
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "userdb"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "userdb"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
