name: Build and Push Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/user-mgmt-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/user-mgmt-backend:latest

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/user-mgmt-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/user-mgmt-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.aliesenli.com/api

  update-ops:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: aliesenli/user_mgmt_service_ops
          token: ${{ secrets.OPS_REPO_TOKEN }}

      - name: Update image tags in values.yaml
        run: |
          sed -i "s|tag: .*|tag: ${{ github.sha }}|g" helm/values.yaml

      - name: Commit and push updated tags
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/values.yaml
          git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
