spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=user-mgmt-service

module.service.url=${MODULE_SERVICE_URL:http://module-service.user-mgmt-prod.svc.cluster.local}

resilience4j.circuitbreaker.instances.moduleService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.moduleService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.moduleService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.moduleService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.moduleService.maxAttempts=3
resilience4j.retry.instances.moduleService.waitDuration=500ms
resilience4j.retry.instances.moduleService.retryExceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.timelimiter.instances.moduleService.timeoutDuration=2s