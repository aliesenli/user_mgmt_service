spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

# Nur diese Endpoints ueber HTTP freigeben (kein pauschales "*")
management.endpoints.web.exposure.include=health,info,prometheus
# Aktiviert /actuator/health/liveness und /readiness (K8s-Probes)
management.endpoint.health.probes.enabled=true
# Gemeinsames Label an allen Metriken -> in Prometheus als application="user-mgmt-backend" filterbar
management.metrics.tags.application=user-mgmt-backend
# Erzeugt die _bucket-Serien fuer http_server_requests; ohne dies liefert histogram_quantile() spaeter keine Daten
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Zusaetzliche feste Bucket-Grenzen (Service Level Objectives) fuer Latenz-Auswertungen
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s